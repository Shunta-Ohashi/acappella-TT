name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node Tests / Lint / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check
        run: pnpm exec tsc -b

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deno:
    name: Deno Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Check Workspace Master Edge Function
        run: >-
          deno check
          --frozen
          --config supabase/functions/workspace-masters/deno.json
          supabase/functions/workspace-masters/index.ts

      - name: Check Cloud Event Save Edge Function
        run: >-
          deno check
          --frozen
          --config supabase/functions/save-cloud-event/deno.json
          supabase/functions/save-cloud-event/index.ts

      - name: Check Cloud Event V2 Save Edge Function
        run: >-
          deno check
          --frozen
          --config supabase/functions/save-cloud-event-v2/deno.json
          supabase/functions/save-cloud-event-v2/index.ts

      - name: Check Live Timetable Projection Edge Function
        run: >-
          deno check
          --frozen
          --config supabase/functions/create-live-timetable/deno.json
          supabase/functions/create-live-timetable/index.ts
